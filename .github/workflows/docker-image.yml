name: Docker Image CI

on:
  push:
    branches: [ 2.0-dev ]
  pull_request:
    branches: [ 2.0-dev ]
    
# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Step1 - Checkout
      uses: actions/checkout@v4
      
    # setup JFrog CLI
    - uses: jfrog/setup-jfrog-cli@v4
      name: Step2 -  Setup JFrog CLI
      env:
        JF_URL: ${{ secrets.JF_URL }}
        # JFrog Platform access token
        JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JFROG_BUILD_STATUS: PASS
      with:
          oidc-provider-name: github
          version: latest
    
    # Verify artifactory conenctivity
    - name: Step2 - Ping RT
      run: |
        # Ping the server
        jf rt ping
      
    - name: Step4 - Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER }}/demo-docker/petclinic:${{github.run_number}}
      
    - name: Step5 - Push Docker image
      run: |
        echo ${{ secrets.DOCKER }}
        jf rt dp ${{ secrets.DOCKER }}/demo-docker/petclinic:${{github.run_number}} demo-docker
    
    - name: Step6- Failure check
      run: |
        echo "JFROG_BUILD_STATUS=FAIL" >> $GITHUB_ENV
      if: failure()
      
    - name: Step7 - Publish build to RT
      env: 
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: |
        # Add env vars
        jf rt bce

        # Collect VCS details from git and add them to the build
        jfrog rt bag
        
        # Publish build-info
        jf rt bp
    - name: Step8 - Xray Scan
      run: |
        jf rt bs --fail=false
        
    - name: Step9 - Docker Promote
      run: |
        jf rt bpr prod-docker
    
